name: Ensia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build LLVM Plugin & Pass Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM 22 Dependencies & CMake
        run: |
          sudo apt-get update
          wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 22
          sudo apt-get install -y cmake ninja-build clang-22 llvm-22-dev llvm-22-tools lld-22 libzstd-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DLT_LLVM_INSTALL_DIR=/usr/lib/llvm-22

      - name: Build Ensia Plugin
        run: |
          cmake --build build --target Ensia --parallel $(nproc)
