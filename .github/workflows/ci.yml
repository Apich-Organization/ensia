name: Ensia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build LLVM Plugin & Pass Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install LLVM 22 Dependencies & CMake
        run: |
          sudo apt-get update
          wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 22
          sudo apt-get install -y cmake ninja-build clang-22 llvm-22-dev llvm-22-tools lld-22 libzstd-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DLT_LLVM_INSTALL_DIR=/usr/lib/llvm-22

      - name: Build Ensia Plugin
        run: |
          cmake --build build --target Ensia --parallel $(nproc)

  test-web-frontend:
    name: Validate Web Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Benchmark SVG Charts
        run: |
          python3 -m pip install --upgrade pip matplotlib numpy
          python3 benchmark/scripts/generate_benchmark_charts.py

      - name: Install Rust + wasm32
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Cargo Check & Trunk Build
        working-directory: web
        run: |
          cargo check
          trunk build --release
